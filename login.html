<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生登录 · 尚志中学 2024 届 09 班</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <section class="section-tight">
    <div class="wrap">
      <div class="panel" style="max-width:420px;margin:0 auto;">
        <h2>学生登录</h2>
        <p class="lead">输入学号即可登录，进入个人主页。</p>
        <div id="msg"></div>
        <div class="field">
          <label>学号</label>
          <input class="input" id="no" placeholder="202409001 — 202409048" autocomplete="off" />
        </div>
        <button class="btn btn-primary" id="btn" style="width:100%;">登录</button>
        <p class="hint center mt16">登录后可上传图片、文字或 Word 文档作品，等待管理员审批后发布。</p>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      SZX.mountNav("login");
      SZX.mountFooter();
      SZX.loadAll();

      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");

      btn.addEventListener("click", function () {
        var no = document.getElementById("no").value.trim();
        if (!no) { msg.innerHTML = '<div class="msg error">请输入学号</div>'; return; }
        btn.disabled = true;
        btn.textContent = "登录中…";
        SZX.loginStudent(no).then(function (r) {
          btn.disabled = false;
          btn.textContent = "登录";
          if (r.ok) {
            location.href = "student.html?no=" + encodeURIComponent(no);
          } else {
            msg.innerHTML = '<div class="msg error">' + SZX.escapeHtml(r.msg) + '</div>';
          }
        });
      });

      document.getElementById("no").addEventListener("keydown", function (e) {
        if (e.key === "Enter") btn.click();
      });
    });
  </script>
</body>
</html>
