<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 学习助手 · 尚志中学 2024 届 09 班</title>
  <meta name="description" content="尚志中学 2024 届 09 班 AI 学习助手 — 写诗、解题、改作文，陪伴学习每一步。" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32" />

  <style>
    /* ---------- AI 聊天页面专属样式 ---------- */
    .chat-app {
      max-width: 800px;
      margin: 0 auto;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .chat-login {
      padding: 48px 24px;
      text-align: center;
    }
    .chat-login .login-avatar {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 14px;
      display: grid; place-items: center; font-size: 34px;
      background: linear-gradient(135deg, rgba(184,137,58,0.16), rgba(31,58,95,0.10));
    }
    .chat-login h2 { margin: 0 0 6px; font-family: var(--serif); color: var(--indigo-dk); }
    .chat-login .lead { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }
    .chat-view {
      display: flex;
      flex-direction: column;
      height: min(70vh, 640px);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 22px 8px;
      scroll-behavior: smooth;
    }
    .chat-empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
    }
    .chat-empty .big {
      font-family: var(--serif);
      font-size: 18px;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .quick-questions {
      display: flex;
      gap: 8px;
      padding: 8px 22px 12px;
      overflow-x: auto;
      flex-wrap: wrap;
      border-top: 1px dashed var(--line);
      background: rgba(255,255,255,0.5);
    }
    .qq-btn {
      flex: none;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .qq-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(216,178,94,0.06);
    }
    .chat-input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 22px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      align-items: flex-end;
    }
    .chat-input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      line-height: 1.5;
      background: #fff;
      color: var(--ink);
    }
    .chat-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(216,178,94,0.18);
    }
    .chat-input::placeholder { color: var(--muted); }
    #sendBtn { flex: none; padding: 11px 22px; }
    #sendBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ---------- 消息气泡 ---------- */
    .msg-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: flex-start;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 10px; flex: none;
      display: grid; place-items: center; font-weight: 800; font-size: 13px;
      color: #fff; font-family: var(--serif);
    }
    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, var(--gold-soft), var(--gold));
      color: #2a1d05;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
    }
    .msg-row.assistant .msg-avatar {
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dk));
      box-shadow: inset 0 0 0 2px rgba(216,178,94,0.45);
    }
    .msg-bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.65;
      box-shadow: var(--shadow-sm);
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, rgba(216,178,94,0.22), rgba(184,137,58,0.16));
      border: 1px solid rgba(184,137,58,0.28);
      color: var(--ink);
      border-top-right-radius: 4px;
    }
    .msg-row.assistant .msg-bubble {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      border-top-left-radius: 4px;
    }
    .msg-bubble p { margin: 0 0 8px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 {
      font-family: var(--serif);
      color: var(--indigo-dk);
      margin: 12px 0 6px;
      line-height: 1.35;
    }
    .msg-bubble h2 { font-size: 18px; }
    .msg-bubble h3 { font-size: 16px; }
    .msg-bubble h4 { font-size: 15px; }
    .msg-bubble ul, .msg-bubble ol { margin: 6px 0 8px; padding-left: 22px; }
    .msg-bubble li { margin: 2px 0; }
    .msg-bubble .code-block {
      background: #1f2733;
      color: #e4e7ee;
      padding: 12px 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: "Courier New", "Consolas", monospace;
      font-size: 13px;
      margin: 8px 0;
      line-height: 1.5;
    }
    .msg-bubble .code-block code {
      background: none; padding: 0; color: inherit; font-size: inherit;
    }
    .msg-bubble .inline-code {
      background: #f1ece0;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: "Courier New", "Consolas", monospace;
      font-size: 13px;
      color: var(--accent);
    }
    .msg-bubble strong { color: var(--indigo-dk); font-weight: 700; }

    /* ---------- 打字动画 ---------- */
    .typing-dots {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 6px 0;
    }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ---------- 使用次数提示 ---------- */
    .usage-info { margin-top: 10px; }
    .usage-tag {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(99,102,241,0.08);
      color: var(--indigo-dk);
      font-size: 13px;
      border: 1px solid rgba(99,102,241,0.18);
    }
    .usage-tag strong { color: var(--gold); font-size: 15px; margin: 0 2px; }

    /* ---------- 移动端 ---------- */
    @media (max-width: 600px) {
      .chat-view { height: 72vh; }
      .chat-messages { padding: 16px 14px 6px; }
      .quick-questions { padding: 6px 14px 10px; }
      .chat-input-bar { padding: 10px 14px 14px; gap: 8px; }
      .msg-bubble { max-width: 86%; font-size: 14px; padding: 10px 13px; }
      .msg-avatar { width: 32px; height: 32px; font-size: 12px; }
      #sendBtn { padding: 10px 16px; font-size: 14px; }
    }
  </style>

<body>
  <div id="splash" class="splash"><div class="splash-inner"><div class="splash-logo">09</div><div class="splash-slogan">四十八位少年，以作品为记</div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>

  <section class="section-tight">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow">AI Tutor</div>
        <h2>AI 学习助手</h2>
        <p>写一首青春的诗、解一道数学题、改一段作文——AI 助手陪你一起学习。无需登录即可使用，每日限 50 次。</p>
        <div id="usageInfo" class="usage-info"></div>
      </div>

      <div class="chat-app" id="chatApp">
        <!-- 聊天视图（无需登录） -->
        <div class="chat-view" id="chatView">
          <div class="chat-messages" id="messages"></div>
          <div class="quick-questions" id="quickQuestions">
            <button class="qq-btn" data-q="帮我写一首关于青春的诗">帮我写一首关于青春的诗</button>
            <button class="qq-btn" data-q="解释这道数学题">解释这道数学题</button>
            <button class="qq-btn" data-q="帮我修改作文">帮我修改作文</button>
            <button class="qq-btn" data-q="请把一段文言文翻译成现代汉语">文言文翻译</button>
            <button class="qq-btn" data-q="讲解一个英语语法知识点">英语语法讲解</button>
            <button class="qq-btn" data-q="总结一个科学知识点">科学知识总结</button>
          </div>
          <div class="chat-input-bar">
            <textarea class="chat-input" id="chatInput" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
            <button class="btn btn-gold" id="sendBtn">发送</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      "use strict";

      var TOKEN_KEY = "szzx_token";         // JWT token（与 app.js 一致）
      var HISTORY_KEY = "szx_ai_chat";      // 聊天记录
      var USAGE_KEY = "szx_ai_usage";       // 使用次数（localStorage，每日重置）
      var DAILY_LIMIT = 50;                 // 每日限制次数
      var API_URL = "/api/ai/chat";

      var messages = [];     // [{role:'user'|'assistant', content:string}]
      var sending = false;

      var chatView = document.getElementById("chatView");
      var messagesEl = document.getElementById("messages");
      var inputEl = document.getElementById("chatInput");
      var sendBtn = document.getElementById("sendBtn");
      var quickEl = document.getElementById("quickQuestions");
      var usageEl = document.getElementById("usageInfo");

      /* ---------- 启动动画 + 页脚 ---------- */
      document.addEventListener("DOMContentLoaded", function () {
        SZX.showSplash();
        SZX.mountFooter();
        init();
      });

      function init() {
        loadHistory();
        renderMessages();
        renderUsage();
        bindEvents();
        inputEl.focus();
      }

      /* ---------- 每日使用次数（localStorage，每日 0 点重置）---------- */
      function today() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      function getUsage() {
        var raw = null;
        try { raw = JSON.parse(localStorage.getItem(USAGE_KEY) || "null"); } catch (e) { raw = null; }
        if (!raw || raw.date !== today()) {
          raw = { date: today(), count: 0 };
          localStorage.setItem(USAGE_KEY, JSON.stringify(raw));
        }
        return raw;
      }
      function incrementUsage() {
        var u = getUsage();
        u.count += 1;
        localStorage.setItem(USAGE_KEY, JSON.stringify(u));
        return u;
      }
      function remaining() {
        var u = getUsage();
        return Math.max(0, DAILY_LIMIT - u.count);
      }
      function renderUsage() {
        var u = getUsage();
        var left = DAILY_LIMIT - u.count;
        if (usageEl) {
          usageEl.innerHTML = '<span class="usage-tag">今日剩余 <strong>' + Math.max(0, left) + '</strong> / ' + DAILY_LIMIT + ' 次</span>';
        }
        if (left <= 0) {
          sendBtn.disabled = true;
          inputEl.placeholder = "今日使用次数已用完，明天再来吧～";
          inputEl.disabled = true;
        }
      }

      /* ---------- 事件绑定 ---------- */
      function bindEvents() {
        sendBtn.addEventListener("click", function () {
          doSend(inputEl.value);
        });

        inputEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            doSend(inputEl.value);
          }
        });

        inputEl.addEventListener("input", autoResize);

        quickEl.addEventListener("click", function (e) {
          var btn = e.target.closest(".qq-btn");
          if (!btn) return;
          doSend(btn.getAttribute("data-q"));
        });
      }

      function autoResize() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
      }

      /* ---------- 聊天记录持久化 ---------- */
      function loadHistory() {
        try {
          var saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          if (Array.isArray(saved)) messages = saved;
        } catch (e) {
          messages = [];
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
        } catch (e) { /* 容量满等异常，忽略 */ }
      }

      /* ---------- 渲染 ---------- */
      function renderMessages() {
        if (messages.length === 0) {
          messagesEl.innerHTML =
            '<div class="chat-empty">' +
            '<div class="big">开始和 AI 助手对话吧</div>' +
            '<div>从下方快捷问题开始，或直接输入你的问题。</div>' +
            '</div>';
          return;
        }
        messagesEl.innerHTML = messages.map(function (m) {
          return renderMessage(m.role, m.content);
        }).join("");
        scrollToBottom();
      }

      function renderMessage(role, content) {
        var label = role === "user" ? "我" : "AI";
        return '<div class="msg-row ' + role + '">' +
          '<div class="msg-avatar">' + label + '</div>' +
          '<div class="msg-bubble">' + renderMarkdown(content) + '</div>' +
          '</div>';
      }

      function appendMessage(role, content) {
        var empty = messagesEl.querySelector(".chat-empty");
        if (empty) empty.remove();
        var tmp = document.createElement("div");
        tmp.innerHTML = renderMessage(role, content);
        messagesEl.appendChild(tmp.firstElementChild);
        scrollToBottom();
      }

      function appendTyping() {
        var empty = messagesEl.querySelector(".chat-empty");
        if (empty) empty.remove();
        var row = document.createElement("div");
        row.className = "msg-row assistant typing-row";
        row.innerHTML =
          '<div class="msg-avatar">AI</div>' +
          '<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function removeTyping(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      /* ---------- 发送流程 ---------- */
      function doSend(text) {
        if (sending) return;
        text = (text || "").replace(/^\s+|\s+$/g, "");
        if (!text) return;

        if (remaining() <= 0) {
          appendMessage("assistant", "⚠ 今日使用次数已用完（" + DAILY_LIMIT + " 次），明天再来吧～");
          return;
        }

        messages.push({ role: "user", content: text });
        saveHistory();
        appendMessage("user", text);

        inputEl.value = "";
        autoResize();

        var typingEl = appendTyping();
        sending = true;
        sendBtn.disabled = true;

        callChatApi(messages.slice()).then(function (reply) {
          removeTyping(typingEl);
          incrementUsage();
          renderUsage();
          messages.push({ role: "assistant", content: reply });
          saveHistory();
          appendMessage("assistant", reply);
        }).catch(function (err) {
          removeTyping(typingEl);
          var msg = (err && err.message) ? err.message : "未知错误";
          appendMessage("assistant", "⚠ 抱歉，发送失败：" + msg + "\n\n请稍后重试。");
        }).then(function () {
          sending = false;
          sendBtn.disabled = remaining() <= 0;
          inputEl.focus();
        });
      }

      function callChatApi(msgs) {
        // 如果有 token 就带上（可选），没有也可以调用
        var token = sessionStorage.getItem(TOKEN_KEY) || "";
        var headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = "Bearer " + token;

        return fetch(API_URL, {
          method: "POST",
          headers: headers,
          body: JSON.stringify({ messages: msgs })
        }).then(function (res) {
          return res.text().then(function (text) {
            var data;
            try { data = JSON.parse(text); } catch (e) {
              throw new Error("AI 服务未就绪：站点需部署到 Cloudflare Pages 后才能使用 AI 功能");
            }
            if (!res.ok) throw new Error(data.error || ("请求失败 (" + res.status + ")"));
            if (data.error) throw new Error(data.error);
            if (typeof data.reply !== "string") throw new Error("返回格式异常");
            return data.reply;
          });
        });
      }

      /* ---------- 轻量 Markdown 渲染 ---------- */
      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function renderMarkdown(text) {
        var escaped = escapeHtml(text);

        // 1. 先抽出代码块（避免被后续行级处理影响）
        var codeBlocks = [];
        escaped = escaped.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
          codeBlocks.push(code.replace(/\n$/, ""));
          return "\u0000CODEBLOCK" + (codeBlocks.length - 1) + "\u0000";
        });

        // 2. 按行处理：标题 / 列表 / 段落
        var lines = escaped.split("\n");
        var out = [];
        var listType = null;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];

          if (/^\u0000CODEBLOCK\d+\u0000$/.test(line)) {
            if (listType) { out.push("</" + listType + ">"); listType = null; }
            out.push(line);
            continue;
          }

          var h = line.match(/^(#{1,4})\s+(.+)$/);
          var ul = line.match(/^[-*]\s+(.+)$/);
          var ol = line.match(/^\d+[.)]\s+(.+)$/);

          if (ul) {
            if (listType !== "ul") {
              if (listType) out.push("</" + listType + ">");
              out.push("<ul>");
              listType = "ul";
            }
            out.push("<li>" + inlineMd(ul[1]) + "</li>");
          } else if (ol) {
            if (listType !== "ol") {
              if (listType) out.push("</" + listType + ">");
              out.push("<ol>");
              listType = "ol";
            }
            out.push("<li>" + inlineMd(ol[1]) + "</li>");
          } else if (h) {
            if (listType) { out.push("</" + listType + ">"); listType = null; }
            var level = Math.min(h[1].length + 1, 6);
            out.push("<h" + level + ">" + inlineMd(h[2]) + "</h" + level + ">");
          } else if (line.trim() === "") {
            if (listType) { out.push("</" + listType + ">"); listType = null; }
            out.push("");
          } else {
            if (listType) { out.push("</" + listType + ">"); listType = null; }
            out.push("<p>" + inlineMd(line) + "</p>");
          }
        }
        if (listType) out.push("</" + listType + ">");

        var html = out.join("\n");

        html = html.replace(/\u0000CODEBLOCK(\d+)\u0000/g, function (m, idx) {
          return '<pre class="code-block"><code>' + codeBlocks[+idx] + '</code></pre>';
        });

        return html;
      }

      function inlineMd(text) {
        text = text.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
        text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        return text;
      }
    })();
  </script>
