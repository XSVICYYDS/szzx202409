<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课程表 · 尚志中学 2024 届 09 班</title>
  <meta name="description" content="尚志中学 2024 届 09 班课程表（夏令时），周一至周五完整课表。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow">Schedule</div>
        <h2>课程表</h2>
        <p id="schedTitle"></p>
      </div>

      <div class="sched-wrap" id="schedWrap"></div>

      <div class="sched-note mt24">
        <div class="saturday" id="schedSat"></div>
        <p class="muted center mt8" id="schedNote"></p>
      </div>

      <div class="legend mt24" id="legend"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      SZX.mountNav("schedule");
      SZX.mountFooter();

      var s = SZX.SCHEDULE;
      document.getElementById("schedTitle").textContent = s.title;
      // 深染课表
      var html = '<table class="sched"><head><tr' +
        '<th class="col-period">节次</th><th class="col-time">时间</th>';
      s.days.forEach(function (d) { html += '<th>' + d + '</th>'; });
      html += '</tr></thead><tbody>';

      s.rows.forEach(function (r, ri) {
        html += '<tr class="' + (ri % 2 ? 'alt' : '') + '">' +
          '<td class="col-period"><span class="period-name">' + SZX.escapeHtml(r.period) + '</span></td>' +
          '<td class="col-time">' + SZX.escapeHtml(r.time) + '</td>';
        r.subs.forEach(function (sub) {
          var c = SZX.getSubjectColor(sub);
          html += '<td><span class="sub-chip" style="background:' + c.bg + ';color:' + c.fg + ';">' +
            SZX.escapeHtml(sub) + '</span></td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById("schedWrap").innerHTML = html;

      document.getElementById("schedSat").textContent = s.saturday;
      document.getElementById("schedNote").textContent = s.note;

      // 科目图例（按出现频次排序）
      var count = {};
      s.rows.forEach(function (r) { r.subs.forEach(function (sub) { count[sub] = (count[sub] || 0) + 1; }); });
      var legend = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; })
        .map(function (sub) {
          var c = SZX.getSubjectColor(sub);
          return '<span class="leg-item"><span class="leg-swatch" style="background:' + c.bg + ';border-color:' + c.fg + ';"></span>' +
            SZX.escapeHtml(sub) + '<span class="leg-count">' + count[sub] + '</span></span>';
        }).join("");
      document.getElementById("legend").innerHTML =
        '<div class="leg-title">科目图例（数字为本周节数）</div><div class="leg-list">' + legend + '</div>';
    });
  </script>
</body>
</html>
