<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课程表 · 尚志中学 2024 届 09 班</title>
  <meta name="description" content="尚志中学 2024 届 09 班课程表（夏令时），周一至周五完整课表。" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/img/favicon-180.png" />
  <link rel="icon" href="assets/img/favicon.ico" />
</head>
<body>
  <div id="splash" class="splash"><div class="splash-inner"><div class="splash-logo">09</div><div class="splash-slogan">四十八位少年，以作品为记</div><div class="splash-dots"><span></span><span></span><span></span></div></div></div>
  <div id="nav"></div>

  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow">Schedule</div>
        <h2>课程表</h2>
        <p id="schedTitle"></p>
      </div>

      <div class="sched-controls">
        <button class="btn btn-ghost2" id="prevDay">← 前一天</button>
        <span class="sched-day-label" id="dayLabel">星期一</span>
        <button class="btn btn-ghost2" id="nextDay">后一天 →</button>
        <button class="btn btn-gold" id="todayBtn" style="margin-left:8px;">今天</button>
      </div>

      <div class="sched-wrap" id="schedWrap"></div>

      <div class="sched-current mt24" id="schedCurrent"></div>

      <div class="sched-note mt24">
        <div class="saturday" id="schedSat"></div>
        <p class="muted center mt8" id="schedNote"></p>
      </div>

      <div class="legend mt24" id="legend"></div>
    </div>
  </section>

  <div id="footer"></div>

  <!-- 课程详情弹窗 -->
  <div class="modal" id="subModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      SZX.showSplash();
      SZX.mountNav("schedule");
      SZX.mountFooter();

      var s = SZX.SCHEDULE;
      document.getElementById("schedTitle").textContent = s.title;

      // 当前选中的星期（0-4 对应 周一到周五）
      var dayIndex = new Date().getDay();
      dayIndex = (dayIndex >= 1 && dayIndex <= 5) ? dayIndex - 1 : 0;

      function fmtHM(t) {
        var p = t.split(":");
        return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
      }

      function getCurrentPeriod() {
        var now = new Date();
        var mins = now.getHours() * 60 + now.getMinutes();
        for (var i = 0; i < s.rows.length; i++) {
          var r = s.rows[i];
          var parts = r.time.split("-");
          if (mins >= fmtHM(parts[0]) && mins <= fmtHM(parts[1])) return i;
        }
        // 找下一节
        for (var j = 0; j < s.rows.length; j++) {
          var parts2 = s.rows[j].time.split("-");
          if (mins < fmtHM(parts2[0])) return j - 0.5; // 非整数表示"下一节"
        }
        return -1;
      }

      function render() {
        var html = '<table class="sched"><thead><tr>' +
          '<th class="col-period">节次</th><th class="col-time">时间</th>';
        s.days.forEach(function (d, i) {
          html += '<th class="' + (i === dayIndex ? 'day-active' : '') + '">' + d + '</th>';
        });
        html += '</tr></thead><tbody>';

        var cur = getCurrentPeriod();
        var todayDow = new Date().getDay() - 1; // 0-4

        s.rows.forEach(function (r, ri) {
          var isCurrent = (Math.floor(cur) === ri) && dayIndex === todayDow;
          var isNext = (cur === ri - 0.5) && dayIndex === todayDow;
          html += '<tr class="' + (ri % 2 ? 'alt' : '') + (isCurrent ? ' row-current' : '') + (isNext ? ' row-next' : '') + '">' +
            '<td class="col-period"><span class="period-name">' + SZX.escapeHtml(r.period) + '</span>' +
            (isCurrent ? '<span class="now-tag">当前</span>' : '') +
            (isNext ? '<span class="next-tag">下一节</span>' : '') +
            '</td><td class="col-time">' + SZX.escapeHtml(r.time) + '</td>';
          r.subs.forEach(function (sub, ci) {
            var c = SZX.getSubjectColor(sub);
            var isActive = (ci === dayIndex);
            html += '<td class="' + (isActive ? 'cell-active' : '') + '">' +
              '<span class="sub-chip" style="background:' + c.bg + ';color:' + c.fg + ';" data-sub="' + SZX.escapeHtml(sub) + '" data-day="' + ci + '" data-period="' + ri + '">' +
              SZX.escapeHtml(sub) + '</span></td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById("schedWrap").innerHTML = html;

        // 今日标签
        var lbl = s.days[dayIndex] + (dayIndex === todayDow ? '（今天）' : '');
        document.getElementById("dayLabel").textContent = lbl;

        // 当前/下一节课提示
        var curInfo = document.getElementById("schedCurrent");
        if (todayDow === dayIndex && cur >= 0) {
          if (cur === Math.floor(cur)) {
            var r = s.rows[cur];
            var sub = r.subs[dayIndex];
            curInfo.innerHTML = '<div class="now-card"><span class="now-icon">⏰</span>' +
              '当前课程：<strong>' + SZX.escapeHtml(sub) + '</strong>（' + SZX.escapeHtml(r.period) + ' · ' + SZX.escapeHtml(r.time) + '）</div>';
          } else {
            var nr = s.rows[Math.ceil(cur)];
            var nsub = nr.subs[dayIndex];
            curInfo.innerHTML = '<div class="now-card next"><span class="now-icon">🔔</span>' +
              '下一节课：<strong>' + SZX.escapeHtml(nsub) + '</strong>（' + SZX.escapeHtml(nr.period) + ' · ' + SZX.escapeHtml(nr.time) + '）</div>';
          }
        } else {
          curInfo.innerHTML = '';
        }

        // 绑定点击
        document.querySelectorAll(".sub-chip").forEach(function (chip) {
          chip.style.cursor = "pointer";
          chip.addEventListener("click", function () {
            var sub = this.getAttribute("data-sub");
            var day = parseInt(this.getAttribute("data-day"), 10);
            var period = parseInt(this.getAttribute("data-period"), 10);
            var r = s.rows[period];
            var c = SZX.getSubjectColor(sub);
            document.getElementById("modalBody").innerHTML =
              '<div style="text-align:center;">' +
              '<div class="file-icon" style="margin:0 auto 12px;background:' + c.bg + ';color:' + c.fg + ';width:64px;height:64px;font-size:28px;">📚</div>' +
              '<h3 style="margin:0 0 8px;color:var(--indigo-dk);">' + SZX.escapeHtml(sub) + '</h3>' +
              '<p class="muted">' + SZX.escapeHtml(s.days[day]) + ' · ' + SZX.escapeHtml(r.period) + '</p>' +
              '<p style="font-size:18px;font-weight:600;color:var(--indigo);">' + SZX.escapeHtml(r.time) + '</p>' +
              '</div>';
            document.getElementById("subModal").style.display = "flex";
          });
        });
      }

      document.getElementById("prevDay").addEventListener("click", function () {
        dayIndex = (dayIndex + 4) % 5; render();
      });
      document.getElementById("nextDay").addEventListener("click", function () {
        dayIndex = (dayIndex + 1) % 5; render();
      });
      document.getElementById("todayBtn").addEventListener("click", function () {
        var d = new Date().getDay();
        dayIndex = (d >= 1 && d <= 5) ? d - 1 : 0; render();
      });

      document.getElementById("modalClose").addEventListener("click", function () {
        document.getElementById("subModal").style.display = "none";
      });
      document.getElementById("subModal").addEventListener("click", function (e) {
        if (e.target === this) this.style.display = "none";
      });

      // 移动端滑动切换
      var touchStartX = 0;
      var schedWrap = document.getElementById("schedWrap");
      schedWrap.addEventListener("touchstart", function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
      schedWrap.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
          if (dx > 0) { dayIndex = (dayIndex + 4) % 5; }
          else { dayIndex = (dayIndex + 1) % 5; }
          render();
        }
      }, { passive: true });

      document.getElementById("schedSat").textContent = s.saturday;
      document.getElementById("schedNote").textContent = s.note;

      // 科目图例
      var count = {};
      s.rows.forEach(function (r) { r.subs.forEach(function (sub) { count[sub] = (count[sub] || 0) + 1; }); });
      var legend = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; })
        .map(function (sub) {
          var c = SZX.getSubjectColor(sub);
          return '<span class="leg-item"><span class="leg-swatch" style="background:' + c.bg + ';border-color:' + c.fg + ';"></span>' +
            SZX.escapeHtml(sub) + '<span class="leg-count">' + count[sub] + '</span></span>';
        }).join("");
      document.getElementById("legend").innerHTML =
        '<div class="leg-title">科目图例（数字为本周节数）</div><div class="leg-list">' + legend + '</div>';

      render();
      // 每分钟刷新当前课程高亮
      setInterval(render, 60000);
    });
  </script>
</body>
</html>
